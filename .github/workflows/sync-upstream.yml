name: Sync upstream rules

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  prepare:
    outputs:
      has-changes: ${{ steps.patch.outputs.has-changes }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run sync:upstream
      - run: bun run vendor:verify
      - run: bun run check
      - name: Validate changed-path allowlist and create patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git add --all
          git diff --cached --name-only --diff-filter=ACDMRTUXB > changed-paths.txt
          while IFS= read -r path; do
            case "$path" in
              vendor/anti-slop/LICENSE|vendor/anti-slop/src/*|vendor/oxc-effect/LICENSE|vendor/oxc-effect/plugin.js|vendor/oxc-effect/lib/*|vendor/oxc-effect/rules/*|vendor/oxc-effect/configs/*|upstream.lock.json|NOTICE.md|rules.manifest.json|src/generated/manifests.ts) ;;
              *) echo "Disallowed sync path: $path" >&2; exit 1 ;;
            esac
          done < changed-paths.txt
          git diff --cached --binary --full-index > sync.patch
          git rev-parse HEAD > base-sha.txt
          if git diff --cached --quiet; then
            echo "has-changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.patch.outputs.has-changes == 'true'
        with:
          name: tested-upstream-sync
          path: |
            sync.patch
            base-sha.txt
          if-no-files-found: error
          retention-days: 1

  propose:
    needs: prepare
    if: needs.prepare.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-upstream-sync
          path: .sync-artifact
      - name: Validate and apply tested patch without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .sync-artifact/base-sha.txt)" = "$(git rev-parse HEAD)"
          git apply --check --index .sync-artifact/sync.patch
          git apply --numstat .sync-artifact/sync.patch | cut -f3- > .sync-artifact/changed-paths.txt
          while IFS= read -r path; do
            case "$path" in
              vendor/anti-slop/LICENSE|vendor/anti-slop/src/*|vendor/oxc-effect/LICENSE|vendor/oxc-effect/plugin.js|vendor/oxc-effect/lib/*|vendor/oxc-effect/rules/*|vendor/oxc-effect/configs/*|upstream.lock.json|NOTICE.md|rules.manifest.json|src/generated/manifests.ts) ;;
              *) echo "Disallowed patch path: $path" >&2; exit 1 ;;
            esac
          done < .sync-artifact/changed-paths.txt
          git apply --index .sync-artifact/sync.patch
          rm -rf .sync-artifact
      - name: Create or update tested sync PR
        id: pull-request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: automation/sync-upstream-rules
          delete-branch: true
          commit-message: "chore: sync upstream lint rules"
          title: "chore: sync upstream lint rules"
          body: |
            Automated allowlisted mirror of current upstream default branches.

            The candidate was built and tested in a read-only job. This write-capable
            job only validated and applied that job's patch; it did not execute candidate code.
      - name: Request auto-merge after read-only CI
        if: steps.pull-request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "${{ steps.pull-request.outputs.pull-request-branch }}"
          gh pr merge "${{ steps.pull-request.outputs.pull-request-number }}" --auto --squash || echo "Auto-merge is unavailable; leaving the tested PR open for review."
